<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Order real Nigerian food from the best restaurants in Lagos and Abuja. Jollof rice, suya, egusi, shawarma — delivered fast." />
    <meta name="theme-color" content="#e8381a" />
    <title>Chop — Nigerian Food Delivery</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('chop-theme') || '{}')
          if (stored.state && stored.state.isDark) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.add('light')
          }
        } catch(e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
